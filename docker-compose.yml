services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codeatlas_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    env_file:
      - ./configs/.env
    depends_on:
      - db

  frontend:
    image: node:18
    container_name: codeatlas_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"

  db:
    image: postgres:15
    container_name: codeatlas_db
    restart: always
    env_file:
      - ./configs/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: